project_id = "wedding-invitation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = []
enable_signup = false

[functions.wedding-api]
# Guests authenticate with invitation tokens; admin actions verify Auth + membership inside the handler.
verify_jwt = false
entrypoint = "./functions/wedding-api/index.ts"
